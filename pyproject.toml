[project]
name = "auth-proxy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "authlib>=1.3",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_proxy"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long — handled by ruff-format
]

[tool.ruff.lint.isort]
known-first-party = ["auth_proxy"]

# ---------------------------------------------------------------------------
# Pixi
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "linux-aarch64"]

# ---------------------------------------------------------------------------
# Default environment — runtime dependencies only
# Enough to run the auth_proxy Flask server.
# ---------------------------------------------------------------------------

[tool.pixi.dependencies]
python = ">=3.11"
flask = ">=3.0"
authlib = ">=1.3"
python-dotenv = ">=1.0"
requests = ">=2.31"

# Install the local auth_proxy package as an editable PyPI dependency
[tool.pixi.pypi-dependencies]
auth-proxy = { path = ".", editable = true }

# ---------------------------------------------------------------------------
# Dev feature — everything needed for local development
# Adds: Caddy, mkcert, rattler-build, pre-commit, ruff, hatchling
# Usage: pixi run -e dev <task>   or   pixi shell -e dev
# ---------------------------------------------------------------------------

[tool.pixi.feature.dev.dependencies]
caddy = "*"
mkcert = "*"
rattler-build = "*"
hatchling = "*"
ruff = ">=0.16.0,<0.17"
prek = ">=0.4.11,<0.5"

[tool.pixi.environments]
# The default environment has only runtime deps (no dev tools).
default = { features = [], solve-group = "default" }
# The dev environment inherits all default deps and adds the dev feature.
dev = { features = ["dev"], solve-group = "default" }

# ---------------------------------------------------------------------------
# Tasks — available in the dev environment
# ---------------------------------------------------------------------------

[tool.pixi.feature.dev.tasks]

# Generate mkcert local CA and issue a certificate for repo.thath.local.
# Running again is safe — mkcert -install is idempotent and overwriting the
# cert files is harmless.
setup-tls = "mkdir -p certs && mkcert -install && mkcert -cert-file certs/repo.thath.local.pem -key-file certs/repo.thath.local-key.pem repo.thath.local"

# Build both example packages into the local channel directory.
build-channel = "rattler-build build -r recipes/greet --output-dir channel && rattler-build build -r recipes/timeutils --output-dir channel"

# Start Caddy (HTTPS on 8443, reads Caddyfile from project root).
serve-caddy = "caddy run --config Caddyfile"

# Install pre-commit hooks into the local git repo.
install-hooks = "pre-commit install"

# Run all pre-commit hooks against all files.
lint = "pre-commit run --all-files"

# Full dev bootstrap: TLS setup → channel build → serve.
start = { depends-on = ["setup-tls", "build-channel", "serve"] }

# ---------------------------------------------------------------------------
# Tasks — available in all environments (default + dev)
# ---------------------------------------------------------------------------

[tool.pixi.tasks]

# Start the Flask auth proxy (internal, HTTP only).
serve-flask = "flask --app auth_proxy.app run --host 0.0.0.0 --port 5000"

# Start both services concurrently (serve-caddy is dev-only, declared above).
serve = { depends-on = ["serve-flask", "serve-caddy"] }
